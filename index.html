<style>

  .btn{background:#22D3EE;color:#0B0F19;padding:16px 32px;border-radius:12px;font-weight:700;font-size:18px;border:none;cursor:pointer;text-decoration:none;display:inline-block}

<body>

<header>

<script>
// SUPABASE CONFIG - YOUR KEYS ARE ALREADY HERE
const SUPABASE_URL = "https://hvksoryjldcbjapzzdrb.supabase.co"
const SUPABASE_ANON_KEY = "sb_publishable_0W8D7FQqCivb_8TQ-xZoSw_CkcYRosC"

document.getElementById('lead-form').addEventListener('submit', async (e) => {
