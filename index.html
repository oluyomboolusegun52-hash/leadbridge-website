<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadBridge - B2B Lead Generation for Africa</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{margin:0;background:#0a0f1e;color:#e2e8f0;font-family:'Segoe UI',Arial,sans-serif}
.container{max-width:1200px;margin:auto;padding:20px}
.btn{background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#000;padding:16px 32px;border-radius:12px;text-decoration:none;font-weight:800;display:inline-block;border:none;cursor:pointer;transition:transform 0.2s}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(56,189,248,0.3)}
.btn-outline{background:transparent;color:#38bdf8;border:2px solid #38bdf8}
.btn-outline:hover{background:#38bdf8;color:#000}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.card{background:#111827;padding:35px;border-radius:16px;margin:20px 0;transition:transform 0.3s;border:1px solid #1e293b}
.card:hover{transform:translateY(-5px);border-color:#38bdf8}
input,textarea{width:100%;padding:16px;margin:12px 0;background:#1e293b;border:2px solid #334155;border-radius:8px;color:#e2e8f0;font-size:16px}
input:focus{outline:none;border-color:#38bdf8}
.hero{padding:140px 20px;text-align:center;background:radial-gradient(circle at center,#1e293b 0%,#0a0f1e 70%)}
.hero h1{font-size:52px;font-weight:900;margin-bottom:20px;background:linear-gradient(135deg,#38bdf8,#0ea5e9);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:20px;color:#94a3b8;max-width:700px;margin:0 auto 40px}
section{padding:100px 20px}
.dark{background:#0a0f1e}
.light{background:#f8fafc;color:#0a0f1e}
.section-title{font-size:42px;text-align:center;margin-bottom:20px}
</style>
</head>
<body>
<div class="container">
  <header>
    <h2>LeadBridge</h2>
    <a href="#contact" class="btn">Book Call</a>
  </header>
</div>

<section class="hero">
  <h1>B2B Leads for African Businesses</h1>
  <p>We help you get 10+ qualified client calls every month. No ads waste. Just results.</p>
  <a href="#contact" class="btn">Get Free Strategy Call</a>
</section>

<section id="contact" class="dark">
  <div class="container">
    <h2 class="section-title">Book Your Free Call</h2>
    <div class="card">
      <form id="leadForm" style="text-align:left">
        <input type="text" id="company" name="company" placeholder="Company Name" required>
        <input type="email" id="email" name="email" placeholder="Work Email" required>
        <input type="text" id="industry" name="industry" placeholder="Industry">
        
        <button type="submit" class="btn" style="width:100%;margin-top:20px">Book My Free Strategy Call</button>
      </form>
    </div>
  </div>
</section>

<script>
document.getElementById('leadForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const formData = {
    company: document.getElementById('company').value,
    email: document.getElementById('email').value,
    industry: document.getElementById('industry').value
  };
  
  await fetch('https://formspree.io/f/mbgjrvpr', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(formData)
  });
  
  window.location.href = '/leadbridge-website/thanks.html';
});
</script>
</body>
</html>
